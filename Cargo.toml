[package]
name = "tws-tester"
version = "0.1.1"
edition = "2021"
rust-version = "1.82"
license = "MIT"
description = "Soak a Bluetooth audio device until playback is gone. TUI, pack on disk."
readme = "README.md"
repository = "https://github.com/itzMRZ/TWS-Battery-Stress-Tester-TUI"
homepage = "https://github.com/itzMRZ/TWS-Battery-Stress-Tester-TUI"
keywords = ["bluetooth", "tui", "audio", "earbuds"]
categories = ["command-line-utilities"]

[lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
collapsible_match = "allow"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
crossterm = { version = "0.29", features = ["event-stream"] }
dirs = "6"
futures = "0.3"
open = "5"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["tokio"] }

[build-dependencies]
resvg = "0.48"

[profile.release]
lto = true
codegen-units = 1
strip = true
